replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: "500m"
    memory: "300Mi"
  limits:
    cpu: "1000m"
    memory: "1000Mi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-subdir-delete
  resources:
    requests:
      storage: 1Gi

extraInitContainers:
  - name: file-permissions
    image: busybox
    command: ['chown', '-R', '1000:1000', '/usr/share/elasticsearch/']
    volumeMounts:
    - mountPath: /usr/share/elasticsearch/data
      name: elasticsearch-master
    securityContext:
      privileged: true
      runAsUser: 0

antiAffinityTopologyKey: "kubernetes.io/hostname"
antiAffinity: "soft"

service:
  enabled: true
  type: NodePort
  nodePort: "30092"