resources:
  requests:
    cpu: "200m"
    memory: "200Mi"
  limits:
    cpu: "400m"
    memory: "512Gi"
service:
  type: NodePort
  loadBalancerIP: ""
  port: 5601
  nodePort: "30093"

ingress:
  enabled: true
  className: "nginx"
  pathtype: ImplementationSpecific
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: kibana.vietdevops.com
      paths:
        - path: /  