apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-app
  labels:
    app: product-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-app
  template:
    metadata:
      labels:
        app: product-app
    spec:
      containers:
        - name: product-app-container
          image: rockman88v/product-app
          ports:
            - containerPort: 5000
          env:
            - name: MAX_DELAY
              value: "2000"
            - name: MIN_DELAY
              value: "100"
      # nodeSelector:
      #   kubernetes.io/hostname: worker1
---
apiVersion: v1
kind: Service
metadata:
  name: product-app-service
  labels:
    app: product-app
spec:
  selector:
    app: product-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP

